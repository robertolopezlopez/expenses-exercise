[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expenses"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn[standard]"]

[project.optional-dependencies]
test = ["httpx2"]

[tool.setuptools]
packages = ["formatter", "parser", "reader"]
py-modules = ["app", "cli"]